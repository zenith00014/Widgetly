<style>
@property --sp{syntax:'<color>';inherits:true;initial-value:#FF6B3D}

*{box-sizing:border-box;margin:0}

body{display:flex;justify-content:center}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}

:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

@media(min-width:521px){.app{border-inline:2px solid var(--ink)}}

.a::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;background:radial-gradient(#0a0a0a 1px,transparent 1.5px) 0 0/5px 5px;-webkit-mask:linear-gradient(135deg,#000,transparent 62%);mask:linear-gradient(135deg,#000,transparent 62%)}
.r43{aspect-ratio:4/3}.r169{aspect-ratio:16/9}.sq{aspect-ratio:1}.r916{aspect-ratio:9/14}

.card{display:block;margin-top:16px;padding:16px;border:2px solid var(--ink);border-radius:0;background:var(--paper);box-shadow:var(--sh);font-size:15px}
.card .ph2{display:flex;gap:8px;margin-bottom:8px}
.lnk{display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:center}.lnk b{display:block;line-height:1.25}
.act{display:flex;justify-content:space-between;align-items:center;margin:16px -8px -8px}

/* tiles + rows */

.t b{display:block;margin-top:12px;font-size:16px;font-weight:800;line-height:1.15;letter-spacing:-.01em}

.row.n{grid-template-columns:40px 48px 1fr auto}

.row .a{width:48px;height:48px;border-radius:0}.row img{width:48px;height:48px;object-fit:cover;display:block}.row b{display:block;font-weight:800;line-height:1.2}

.cat{color:var(--k);display:flex;align-items:flex-end;gap:8px;min-height:80px;padding:16px;text-align:left;border:2px solid var(--ink);border-radius:0;box-shadow:var(--sh);transition:transform .4s var(--spr),box-shadow .4s var(--spr)}
.cat:first-child{grid-row:span 2;min-height:176px}

.cat:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sp)}

/* player: big card + mini ticket */
.big{display:block;position:relative;margin:24px 16px 0}

.mini{position:absolute;left:12px;right:12px;bottom:calc(var(--nav) + var(--sa) + 24px);z-index:4;display:grid;grid-template-columns:48px 1fr auto auto auto;gap:8px 12px;align-items:center;padding:12px;background:var(--paper);border:2px solid var(--ink);border-radius:0;box-shadow:var(--sh);transform:translateY(160%) rotate(2deg);opacity:0;visibility:hidden;transition:transform .7s var(--spr),opacity .3s,visibility 0s .7s}
.mini.on{transform:none;opacity:1;visibility:visible;transition:transform .7s var(--spr),opacity .3s}

/* nav dock */
.nav{position:absolute;left:12px;right:12px;bottom:calc(var(--sa) + 12px);z-index:6;height:var(--nav);display:grid;grid-template-columns:repeat(6,1fr);align-items:center;padding:0 4px;background:var(--paper);border:2px solid var(--ink);border-radius:0;box-shadow:var(--sh)}

.nav,.mini,.si,.seg,.bi{background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 45%,rgba(255,255,255,.1));-webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.1);backdrop-filter:blur(22px) saturate(1.8) brightness(1.1);border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 28px rgba(255,255,255,.04)}

h1,h2,.top1 b,.cat b,.tr,.hl b,.wm{text-transform:uppercase}
.pf{background:var(--ink)}
.hl b{font-size:22px}.wm i{width:12px;height:12px}

.unified-group{padding-bottom:12px}.unified-group h2{padding-top:26px;padding-bottom:12px}.unified-group h2 small{font:500 11px var(--m);color:var(--mu)}.search-filters{padding-top:16px}.search-filters .chip{min-height:40px;padding-inline:13px}.video-player-host{width:100%;min-height:190px;aspect-ratio:16/9;height:auto;max-height:260px}.video-player-tools{overflow:hidden}.video-controls .row,.music-find .row{border-top:1px solid rgba(242,242,238,.18)}.news-controls .news-feature,.news-controls .news-item{cursor:pointer}.news-controls .news-feature:active,.news-controls .news-item:active{transform:scale(.99)}

/* personalized feeds and genuine source controls */
.feed-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 6px}
.feed-section{padding:4px 0 10px}
.feed-section h2{padding-top:28px}
.empty-state{margin:16px;padding:22px;border:2px solid var(--ink);background:var(--paper2);box-shadow:var(--sh)}
.empty-state b{display:block;font:800 21px/1.1 var(--f);margin-bottom:10px}
.empty-state p{color:var(--mu);font-size:14px;margin-bottom:16px}
.source-card{display:flex;gap:14px;align-items:flex-start;padding:16px;border-top:1px solid rgba(242,242,238,.18)}
.source-card>img{width:64px;height:64px;object-fit:cover;border:2px solid var(--ink);background:var(--paper2)}
.source-info{flex:1;min-width:0}
.source-info>b{display:block;font-weight:800;font-size:16px}
.source-info>span{display:block;font:11px var(--m);color:var(--mu);margin-top:3px}
.source-info>p{font-size:13px;color:var(--mu);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.source-actions,.result-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.source-actions .chip,.result-actions .chip{min-height:36px;padding:0 10px;font-size:10px}
.result-wrap{border-top:1px solid rgba(242,242,238,.18);padding:0 12px 10px}
.result-wrap .row{border-top:0;padding-inline:4px}
.result-actions{padding:0 6px}
.news-item{padding:14px 16px;border-top:1px solid rgba(242,242,238,.18);background:linear-gradient(110deg,rgba(255,255,255,.025),transparent)}
.news-open{display:block;width:100%;text-align:left;padding:0;min-height:0}
.news-open b{display:block;font:800 19px/1.12 var(--f)}
.news-open span{display:block;font:11px var(--m);color:var(--mu);margin-top:7px}
.news-open p{font-size:13px;line-height:1.4;margin-top:8px;color:var(--mu)}
.news-open:after{content:'';display:block;clear:both}
.topics-grid{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 16px}
.topic-chip[aria-pressed=true]{background:var(--sp);color:var(--k)}
.video-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.video-toolbar .chip{min-height:38px}
.video-player-host{position:relative;width:100%;min-height:220px;aspect-ratio:16/9;background:#050505;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:16px}
.video-player-host>span{font:700 12px var(--m);letter-spacing:.04em}
.mini .a{background-color:var(--paper2);background-size:cover;background-position:center}
.mini .a:after{display:none}
@media(min-width:420px){.source-card>img{width:72px;height:72px}}
</style></head>
<body>
<div class="app">

      <button class="me ib" aria-label="Your profile"><span class="a" id="meA"></span></button>

<script>
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const IC={
 home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',
 vid:'M4 5h16v14H4zM10 9l5 3-5 3z',
 music:'M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z',
 news:'M4 4h13v16H4zM17 8h3v10a2 2 0 01-2 2M7 8h7M7 12h7M7 16h4',
 search:'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4',
 play:'M7 4l13 8-13 8z', pause:'M7 5h3v14H7zM14 5h3v14h-3z',
 arrow:'M5 12h14M13 6l6 6-6 6', follow:'M12 5v14M5 12h14'
};
const FILL=['play','pause'];
const ic=n=>'<svg class="ic'+(FILL.includes(n)?' f':'')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(IC[n]||IC.arrow)+'"/></svg>';
const PAL=['#FF6B3D','#4D7DFF','#D8FF3F','#35E0E0','#B58CFF','#3DDC84'];
const TOPICS=['Science','Technology','History','Education','Design','Engineering','Economics','Culture','Environment','Sports','Music','Health','Language','Business','Art','Documentaries','Books','Philosophy','Current affairs','World news','Cooking','Travel','Architecture','Psychology','Space','Mathematics','Programming','Photography','Film analysis','Gaming','Memes','Viral clips','Celebrity gossip','Pranks','Internet drama','Reality TV','Shorts'];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let prefs={topics:['Science','Technology','History','Education','Design','Engineering','Economics','Culture','Environment','Sports','Music','Health','Language','Business','Art','Documentaries'],sources:[]};
let page='home',homeTab='fy',unifiedMode='all',unifiedQuery='',mediaState={hasItem:false,isMusic:false,isVideo:false,isPlaying:false,title:'',artist:'',artwork:''};
const unifiedData={videos:[],music:[],news:[],channels:[]};
const selectedTopics=()=>prefs.topics||[];
function loadPrefs(){
 try{if(window.RushNative){const raw=RushNative.getFeedPreferences();if(raw)prefs=JSON.parse(raw)}}catch(e){}
}
function saveTopics(){
 const selected=[...document.querySelectorAll('[data-topic][aria-pressed="true"]')].map(b=>b.dataset.topic);
 if(!selected.length){const s=$('#topicStatus');if(s)s.textContent='Choose at least one topic.';return}
 if(window.RushNative)RushNative.saveFeedTopics(JSON.stringify(selected));
}
function sourceExists(kind,id){return prefs.sources.some(s=>s.kind===kind&&s.id===id)}
function sourceFor(kind,id){return prefs.sources.find(s=>s.kind===kind&&s.id===id)}
function sourceButton(kind,id,name,label){
 const found=sourceExists(kind,id);
 return '<button class="chip source-follow" data-follow-kind="'+esc(kind)+'" data-source-id="'+esc(id)+'" data-source-name="'+esc(name)+'">'+(found?'FOLLOWING':(label||'FOLLOW'))+'</button>';
}
function channelCard(x){
 const found=sourceFor('channel',x.id),selected=!!(found&&found.productive);
 return '<article class="source-card"><img src="'+esc(x.thumbnail)+'" alt="" loading="lazy"><div class="source-info"><b>'+esc(x.name)+'</b><span>'+esc(x.subscribers||'YouTube channel')+'</span><p>'+esc(x.description||'')+'</p><div class="source-actions">'+sourceButton('channel',x.id,x.name,'FOLLOW')+'<button class="chip" data-recommend-channel data-source-id="'+esc(x.id)+'" data-source-name="'+esc(x.name)+'" aria-pressed="'+selected+'">'+(selected?'IN FOR YOU':'ADD TO FOR YOU')+'</button></div></div></article>';
}
function videoRow(x){
 return '<button class="row n" data-video-id="'+esc(x.id)+'" data-title="'+esc(x.title)+'" data-creator="'+esc(x.artist||x.creator)+'" data-thumbnail="'+esc(x.thumbnail)+'"><img src="'+esc(x.thumbnail)+'" alt="" loading="lazy"><div><b>'+esc(x.title)+'</b><span>'+esc(x.artist||x.creator||'YouTube')+' · '+esc(x.duration||'')+'</span></div>'+ic('play')+'</button>';
}
function musicRow(x){
 return '<div class="result-wrap">'+videoLikeMusic(x) + '<div class="result-actions">'+sourceButton('artist',x.artist,x.artist,'FOLLOW ARTIST')+'</div></div>';
}
function videoLikeMusic(x){
 return '<button class="row n" data-track="'+esc(x.id)+'" data-title="'+esc(x.title)+'" data-artist="'+esc(x.artist)+'" data-thumbnail="'+esc(x.thumbnail)+'"><img src="'+esc(x.thumbnail)+'" alt="" loading="lazy"><div><b>'+esc(x.title)+'</b><span>'+esc(x.artist)+' · '+esc(x.duration||'')+'</span></div>'+ic('play')+'</button>';
}
function newsCard(x){
 return '<article class="news-item"><button class="news-open" data-news-url="'+esc(x.url)+'">'+(x.thumbnail?'<img class="news-thumb" src="'+esc(x.thumbnail)+'" alt="" loading="lazy">':'')+'<b>'+esc(x.title)+'</b><span>'+esc(x.source)+' · '+esc(x.date)+'</span><p>'+esc(x.summary||'')+'</p></button><div class="result-actions">'+sourceButton('news',x.source,x.source,'FOLLOW PUBLISHER')+'</div></article>';
}
function section(title,body){
 return '<section class="feed-section"><h2>'+title+'</h2>'+(body||'<p class="meta pad">Nothing to show yet.</p>')+'</section>';
}
function pageTop(title,kicker){
 return '<header class="pt"><h1>'+title+'</h1><em class="stk">'+kicker+'</em></header>';
}
function renderHome(){
 return pageTop('Home','your feed')+
 '<div class="seg" role="tablist"><i></i><button role="tab" data-tab="fy" aria-selected="'+(homeTab==='fy')+'">For you</button><button role="tab" data-tab="fo" aria-selected="'+(homeTab==='fo')+'">Following</button></div>'+
 '<div class="feed-actions"><button class="chip" data-open-topics>CHOOSE TOPICS</button><button class="chip" data-open-search>FIND CHANNELS & SOURCES</button></div>'+
 '<p class="meta pad" id="homeFeedStatus">Building your feed…</p><div id="homeFeedResults"></div>';
}
function renderVideoPage(){
 return pageTop('Videos','YouTube')+
 '<section class="video-controls"><div class="video-player-tools"><div id="videoPlayerHost" class="video-player-host"><span>Choose a video to start watching.</span></div><div class="video-toolbar"><p class="meta" id="videoPlaybackStatus">Your selected video will play here.</p><button class="chip" data-video-fullscreen>FULL SCREEN</button></div><div id="videoCaptions" class="video-captions" aria-live="polite"></div></div>'+
 '<h2>Find videos</h2><label class="si">'+ic('search')+'<input id="videoQuery" type="search" placeholder="Search videos, creators and topics" aria-label="Search videos" autocomplete="off"></label><button class="btn" data-video-search>SEARCH YOUTUBE</button><p class="meta pad" id="videoStatus">Search all of YouTube. Recommendations are filtered separately.</p><div id="videoResults"></div></section>';
}
function renderMusicPage(){
 return pageTop('Music','your listening taste')+
 '<section class="music-now" id="musicNowPlaying"><div class="music-now-art"><img id="musicNowArtwork" src="" alt="Current track artwork"><span id="musicNowFallback">NO<br>MUSIC</span></div><div class="music-now-copy"><span class="stk">NOW PLAYING</span><h3 id="musicNowTitle">No music playing</h3><p id="musicNowArtist">Video playback will not appear here.</p><p class="meta" id="musicStatus">Start a track or browse music.</p><button class="btn k" data-music-toggle aria-label="Play or pause music">'+ic('play')+' PLAY / PAUSE</button></div></section>'+
 '<h2>Picked for your taste</h2><p class="meta pad" id="musicSuggestionStatus">Using your listening history and followed musicians.</p><div id="musicSuggestions"></div>'+
 '<h2>Discover music</h2><section class="music-find"><label class="si">'+ic('search')+'<input id="musicQuery" type="search" placeholder="Search songs, artists or albums" aria-label="Search music" autocomplete="off"></label><button class="btn" data-music-search>SEARCH MUSIC</button><div id="musicResults"></div></section>'+
 '<section><h2>Browse genres</h2><div class="gen">'+['Pop','Hip-hop','Electronic','Rock','Jazz','Ambient','Classical','Folk'].map((t,i)=>'<button class="cat" data-music-term="'+t+'" style="background:'+PAL[(i+1)%PAL.length]+'"><b>'+t+'</b><i aria-hidden="true">→</i></button>').join('')+'</div></section>'+
 '<section><h2>Recently played</h2><div id="musicRecent"><p class="meta pad">Your listening history will appear here.</p></div></section>'+
 '<section class="lyrics-section"><h2>Lyrics</h2><p class="meta" id="lyricsStatus">Play a track to load its lyrics.</p><div id="lyricsPanel" class="lyrics-panel"></div></section>';
}
function renderNewsPage(){
 return pageTop('News','useful reporting')+
 '<section class="news-controls"><div class="chips news-chips">'+['Personalized','World','Technology','Science','Business','Sports','Culture','Health'].map((t,i)=>'<button class="chip" data-news-category="'+t+'" aria-pressed="'+(i===0)+'">'+t+'</button>').join('')+'</div><label class="si">'+ic('search')+'<input id="newsQuery" type="search" placeholder="Search headlines and publishers" aria-label="Search news" autocomplete="off"></label><button class="btn" data-news-search>SEARCH NEWS</button><p class="meta pad" id="newsStatus">Ranking reporting from your topics and followed publishers…</p><div id="newsResults"></div></section>';
}
function renderSearchPage(){
 return pageTop('Search','open discovery')+
 '<label class="si">'+ic('search')+'<input id="q" type="search" placeholder="Search videos, music, news, channels or artists" aria-label="Search all Widgetly" autocomplete="off"></label><button class="btn" data-unified-search>SEARCH ALL SOURCES</button>'+
 '<div class="chips search-filters"><button class="chip" data-search-filter="all" aria-pressed="true">All</button><button class="chip" data-search-filter="videos" aria-pressed="false">Videos</button><button class="chip" data-search-filter="music" aria-pressed="false">Music</button><button class="chip" data-search-filter="news" aria-pressed="false">News</button><button class="chip" data-search-filter="channels" aria-pressed="false">Channels</button></div>'+
 '<p class="meta pad" id="unifiedStatus">Search is broad. Recommendation rules do not restrict these results.</p><div id="unifiedResults"></div>';
}
function renderTopicsPage(){
 return pageTop('Your topics','personalize recommendations')+
 '<p class="pad meta">Choose any subjects you care about. Low-focus topics remain searchable, but receive less weight in recommendations.</p><div class="topics-grid" id="topicOptions">'+TOPICS.map((t,i)=>'<button class="chip topic-chip" data-topic="'+esc(t)+'" aria-pressed="'+selectedTopics().includes(t)+'">'+esc(t)+'</button>').join('')+'</div>'+
 '<div class="feed-actions"><button class="btn k" data-save-topics>SAVE TOPICS</button><span class="meta" id="topicStatus">'+selectedTopics().length+' topics selected</span></div>'+
 '<h2>Followed sources</h2><p class="meta pad">Follow any channel, publisher or musician. YouTube channels need the “Add to For You” flag to enter the productive recommendation pool.</p><div id="followedSources"></div>';
}
const R={home:renderHome,videos:renderVideoPage,music:renderMusicPage,news:renderNewsPage,search:renderSearchPage,topics:renderTopicsPage};
const NAV=[['home','Home','home'],['videos','Videos','vid'],['music','Music','music'],['news','News','news'],['search','Search','search']];
$('#nav').innerHTML='<i class="pill"></i>'+NAV.map(([key,label,icon])=>'<a href="#'+key+'" data-k="'+key+'">'+ic(icon)+'<span>'+label+'</span></a>').join('');
function navPosition(){
 const active=$('#nav a[aria-current]'),nav=$('#nav');if(!active)return;
 nav.style.setProperty('--lx',active.offsetLeft+2+'px');nav.style.setProperty('--lw',active.offsetWidth-4+'px');
}
function indicator(){
 const seg=$('.seg'),button=seg&&seg.querySelector('[aria-selected="true"]');
 if(button){seg.style.setProperty('--tx',button.offsetLeft+'px');seg.style.setProperty('--tw',button.offsetWidth+'px')}
}
function renderSources(){
 const root=$('#followedSources');if(!root)return;
 root.innerHTML=prefs.sources.length?prefs.sources.map(s=>{
  return '<article class="source-card"><div class="source-info"><b>'+esc(s.name)+'</b><span>'+esc(s.kind)+(s.kind==='channel'?(s.productive?' · included in For You':' · Following only'):' · Following')+'</span><div class="source-actions">'+
   (s.kind==='channel'?'<button class="chip" data-recommend-channel data-source-id="'+esc(s.id)+'" data-source-name="'+esc(s.name)+'" aria-pressed="'+!!s.productive+'">'+(s.productive?'REMOVE FROM FOR YOU':'ADD TO FOR YOU')+'</button>':'')+
   '<button class="chip" data-unfollow-kind="'+esc(s.kind)+'" data-source-id="'+esc(s.id)+'">UNFOLLOW</button></div></div></article>';
 }).join(''):'<p class="meta pad">You are not following any sources yet. Search for channels, publishers or musicians to add them.</p>';
}
function applyPrefs(data){
 if(data&&data.topics&&data.sources)prefs=data;
 const root=$('#topicOptions');
 if(root)root.querySelectorAll('[data-topic]').forEach(b=>b.setAttribute('aria-pressed',selectedTopics().includes(b.dataset.topic)));
 const status=$('#topicStatus');if(status)status.textContent=selectedTopics().length+' topics selected';
 renderSources();
}
function loadFeedPreferences(){
 try{if(window.RushNative){const raw=RushNative.getFeedPreferences();if(raw)applyPrefs(JSON.parse(raw))}}catch(e){}
}
function go(){
 page=(location.hash||'#home').slice(1);
 if(!R[page])page='home';
 $('#v').innerHTML=R[page]();
 document.querySelectorAll('#nav a').forEach(a=>a.dataset.k===page?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 $('#sc').scrollTop=0;navPosition();indicator();loadFeedPreferences();
 if(window.RushNative){RushNative.loadCurrentPlayback();
  if(page==='home')loadHomeFeed();
  if(page==='videos')RushNative.showCurrentVideo();
  else RushNative.hideVideo();
  if(page==='music'){RushNative.loadMusicHistory();RushNative.loadMusicSuggestions();RushNative.loadCurrentMusicLyrics()}
  if(page==='news')RushNative.loadPersonalizedNews();
 }
}
function loadHomeFeed(){
 const status=$('#homeFeedStatus');if(status)status.textContent=homeTab==='fy'?'Finding videos from your selected productive channels…':'Loading posts from sources you follow…';
 if(window.RushNative)RushNative.loadHomeFeed(homeTab==='fy'?'forYou':'following');
}
function renderFeedResults(data){
 if(page!=='home')return;
 const root=$('#homeFeedResults'),status=$('#homeFeedStatus');if(!root)return;
 const videos=(data.videos||[]),music=(data.music||[]),news=(data.news||[]);
 const v=videos.map(videoRow).join(''),m=music.map(musicRow).join(''),n=news.map(newsCard).join('');
 root.innerHTML=(v?section(homeTab==='fy'?'Recommended from your selected channels':'Latest from followed channels',v):'')+
  (m?section('From musicians you follow',m):'')+(n?section('From publishers you follow',n):'')+
  (!v&&!m&&!n?'<div class="empty-state"><b>'+esc(data.message||'No recommendations yet.')+'</b><p>Use Search to follow sources. Choose which YouTube channels are eligible for For You.</p><button class="btn k" data-open-search>FIND SOURCES</button></div>':'');
 if(status)status.textContent=data.message||((videos.length+music.length+news.length)+' items · '+(homeTab==='fy'?'productive channel selection':'following'));
}
function renderChannels(items){
 const root=$('#channelResults');if(!root)return;
 root.innerHTML=items.map(channelCard).join('')||'<p class="meta pad">No channels found. Try the channel name or handle.</p>';
}
function renderSearchResults(){
 const root=$('#unifiedResults');if(!root||page!=='search')return;
 const groups={
  videos:unifiedData.videos,
  music:unifiedData.music,
  news:unifiedData.news,
  channels:unifiedData.channels
 };
 const names={videos:'Videos',music:'Music',news:'News',channels:'YouTube channels'};
 const renderers={videos:items=>items.map(videoRow).join(''),music:items=>items.map(musicRow).join(''),news:items=>items.map(newsCard).join(''),channels:items=>items.map(channelCard).join('')};
 root.innerHTML=Object.keys(groups).filter(k=>unifiedMode==='all'||unifiedMode===k).map(k=>{
  const items=groups[k];return section(names[k]+' · '+items.length,renderers[k](items));
 }).join('')||'<p class="meta pad">No results in this category.</p>';
 const total=Object.values(groups).reduce((sum,items)=>sum+items.length,0);
 const status=$('#unifiedStatus');if(status)status.textContent=total+' results · search keeps broader discovery open';
}
function runUnifiedSearch(){
 const q=$('#q')?.value.trim();if(!q)return;
 unifiedQuery=q;Object.keys(unifiedData).forEach(k=>unifiedData[k]=[]);
 const status=$('#unifiedStatus');if(status)status.textContent='Searching YouTube, YouTube Music and news sources…';
 $('#unifiedResults').innerHTML='';
 if(window.RushNative){RushNative.searchVideos(q);RushNative.searchMusic(q);RushNative.searchNews(q);RushNative.searchChannels(q)}
}
function updateMini(){
 const mini=$('#mini');if(!mini)return;
 const show=!!mediaState.hasItem&&!(!mediaState.title);
 mini.classList.toggle('on',show);mini.inert=!show;
 if(!show)return;
 $('#mt').textContent=mediaState.title||'Now playing';
 $('#ms').textContent=(mediaState.isMusic?'MUSIC':(mediaState.isVideo?'VIDEO':'MEDIA'))+(mediaState.artist?' · '+mediaState.artist:'');
 const a=$('#ma');if(a)a.style.backgroundImage=mediaState.artwork?'url("'+esc(mediaState.artwork)+'")':'none';
 $('#mp').innerHTML=ic(mediaState.isPlaying?'pause':'play');
}
function updateCurrentPlayback(data){
 mediaState=Object.assign({},mediaState,data||{});
 updateMini();
 if(page==='music'){
  const isMusic=mediaState.hasItem&&mediaState.isMusic;
  const title=$('#musicNowTitle'),artist=$('#musicNowArtist'),status=$('#musicStatus'),img=$('#musicNowArtwork'),box=img&&img.parentElement;
  if(title)title.textContent=isMusic?(mediaState.title||'Unknown track'):'No music playing';
  if(artist)artist.textContent=isMusic?(mediaState.artist||'Unknown artist'):'Video playback will not appear here.';
  if(status)status.textContent=isMusic?(mediaState.isPlaying?'PLAYING':'PAUSED'):'Start a track or follow a musician.';
  if(img&&box){if(isMusic&&mediaState.artwork){img.src=mediaState.artwork;box.classList.add('has-art')}else{img.removeAttribute('src');box.classList.remove('has-art')}}
  const toggle=$('[data-music-toggle]');if(toggle)toggle.innerHTML=ic(isMusic&&mediaState.isPlaying?'pause':'play')+(isMusic&&mediaState.isPlaying?' PAUSE':' PLAY');
 }
}
function renderPreferencePage(){
 applyPrefs(prefs);renderSources();
}
function handleFollow(kind,id,name,productive){
 if(!window.RushNative)return;
 RushNative.followSource(kind,id,name,!!productive);
}
function refreshCurrentPage(){
 if(page==='home')loadHomeFeed();
 if(page==='topics')renderPreferencePage();
 if(page==='search')renderSearchResults();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='topicsShortcut'||b.hasAttribute('data-open-topics')||b.id==='profileShortcut'){location.hash='#topics';return}
 if(b.hasAttribute('data-open-search')){location.hash='#search';return}
 if(b.dataset.tab){homeTab=b.dataset.tab;$('#v').innerHTML=R.home();indicator();loadHomeFeed();return}
 if(b.hasAttribute('data-save-topics')){saveTopics();return}
 if(b.dataset.topic){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));return}
 if(b.hasAttribute('data-unified-search')){runUnifiedSearch();return}
 if(b.dataset.searchFilter){unifiedMode=b.dataset.searchFilter;document.querySelectorAll('[data-search-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderSearchResults();return}
 if(b.hasAttribute('data-video-search')){const q=$('#videoQuery')?.value.trim();if(q&&window.RushNative){$('#videoStatus').textContent='Searching YouTube…';$('#videoResults').innerHTML='';RushNative.searchVideos(q)}return}
 if(b.hasAttribute('data-channel-search')){const q=$('#channelQuery')?.value.trim();if(q&&window.RushNative){$('#channelStatus').textContent='Searching channels…';$('#channelResults').innerHTML='';RushNative.searchChannels(q)}return}
 if(b.hasAttribute('data-music-search')){const q=$('#musicQuery')?.value.trim();if(q&&window.RushNative){$('#musicStatus').textContent='Searching YouTube Music…';$('#musicResults').innerHTML='';RushNative.searchMusic(q)}return}
 if(b.dataset.musicTerm){const input=$('#musicQuery');if(input)input.value=b.dataset.musicTerm;if(window.RushNative)RushNative.searchMusic(b.dataset.musicTerm);return}
 if(b.hasAttribute('data-news-search')){const q=$('#newsQuery')?.value.trim();if(q&&window.RushNative)RushNative.searchNews(q);return}
 if(b.dataset.newsCategory){document.querySelectorAll('[data-news-category]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(b.dataset.newsCategory==='Personalized')RushNative.loadPersonalizedNews();else if(window.RushNative)RushNative.loadNews(b.dataset.newsCategory);return}
 if(b.dataset.followKind){if(sourceExists(b.dataset.followKind,b.dataset.sourceId))RushNative.unfollowSource(b.dataset.followKind,b.dataset.sourceId);else handleFollow(b.dataset.followKind,b.dataset.sourceId,b.dataset.sourceName,false);return}
 if(b.hasAttribute('data-recommend-channel')){const source=sourceFor('channel',b.dataset.sourceId);if(window.RushNative)RushNative.setChannelRecommended(b.dataset.sourceId,b.dataset.sourceName,!(source&&source.productive));return}
 if(b.dataset.unfollowKind){if(window.RushNative)RushNative.unfollowSource(b.dataset.unfollowKind,b.dataset.sourceId);return}
 if(b.dataset.videoId){const d=b.dataset;const host=$('#videoPlayerHost');if(host){host.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});host.innerHTML='<span>LOADING VIDEO…</span>'}const status=$('#videoPlaybackStatus');if(status)status.textContent='Preparing video…';if(window.RushNative)RushNative.playVideo(d.videoId,d.title,d.creator,d.thumbnail);return}
 if(b.dataset.track){const d=b.dataset;const status=$('#musicStatus');if(status)status.textContent='Preparing track…';if(window.RushNative)RushNative.playMusic(d.track,d.title,d.artist,d.thumbnail);return}
 if(b.dataset.newsUrl){if(window.RushNative)RushNative.openNews(b.dataset.newsUrl);return}
 if(b.hasAttribute('data-video-fullscreen')){if(window.RushNative)RushNative.setVideoFullscreen(true);return}
 if(b.hasAttribute('data-video-close')){if(window.RushNative)RushNative.hideVideo();return}
 if(b.hasAttribute('data-music-toggle')){if(mediaState.hasItem&&mediaState.isMusic&&window.RushNative)RushNative.togglePlayback();return}
 if(b.dataset.act==='toggle'){if(window.RushNative)RushNative.togglePlayback();return}
 if(b.dataset.act==='open'){location.hash=mediaState.isMusic?'#music':'#videos';return}
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 if(e.target.id==='q'){e.preventDefault();runUnifiedSearch()}
 if(e.target.id==='videoQuery'){e.preventDefault();const b=$('[data-video-search]');if(b)b.click()}
 if(e.target.id==='channelQuery'){e.preventDefault();const b=$('[data-channel-search]');if(b)b.click()}
 if(e.target.id==='musicQuery'){e.preventDefault();const b=$('[data-music-search]');if(b)b.click()}
 if(e.target.id==='newsQuery'){e.preventDefault();const b=$('[data-news-search]');if(b)b.click()}
});
window.rushFeedPreferences=data=>{applyPrefs(data);refreshCurrentPage()};
window.rushFeedPreferencesError=error=>{const t=$('#topicStatus');if(t)t.textContent=error.message||'Could not save preferences.'};
window.rushCurrentPlayback=updateCurrentPlayback;
window.rushHomeFeedResults=renderFeedResults;
window.rushChannelSearchResults=items=>{renderChannels(items);if(page==='search'){unifiedData.channels=items;renderSearchResults()}};
window.rushChannelSearchError=error=>{const s=$('#channelStatus')||$('#unifiedStatus');if(s)s.textContent=error.message||'Channel search failed.'};
window.rushVideoSearchResults=items=>{
 unifiedData.videos=items;renderSearchResults();
 const root=$('#videoResults');if(root)root.innerHTML=items.map(videoRow).join('')||'<p class="meta pad">No videos found. Try another search.</p>';
 const status=$('#videoStatus');if(status)status.textContent=items.length+' videos found';
};
window.rushVideoSearchError=error=>{const s=$('#videoStatus')||$('#unifiedStatus');if(s)s.textContent=error.message||'Video search failed.'};
window.rushVideoPlaybackState=state=>{
 const s=$('#videoPlaybackStatus');if(s)s.textContent=state.state==='playing'?'NOW PLAYING · '+state.title+(state.captionTracks?' · CAPTIONS AVAILABLE':''):state.message||state.state;
 if(state.state==='loading'){const host=$('#videoPlayerHost');if(host)host.innerHTML='<span>LOADING VIDEO…</span>'}
 if(state.state==='playing'&&window.RushNative)RushNative.loadCurrentPlayback();
};
window.rushVideoCaptions=lines=>{const root=$('#videoCaptions');if(root)root.textContent=lines.join(' ')};
window.rushMusicSearchResults=items=>{
 unifiedData.music=items;renderSearchResults();
 const root=$('#musicResults');if(root)root.innerHTML=items.map(musicRow).join('')||'<p class="meta pad">No tracks found. Try another search.</p>';
 const status=$('#musicStatus');if(status)status.textContent=items.length+' tracks found';
};
window.rushMusicSearchError=error=>{const s=$('#musicStatus')||$('#unifiedStatus');if(s)s.textContent=error.message||'Music search failed.'};
window.rushMusicHistory=items=>{const root=$('#musicRecent');if(root)root.innerHTML=items.slice(0,8).map(musicRow).join('')||'<p class="meta pad">No tracks played yet.</p>'};
window.rushMusicSuggestionResults=data=>{
 const items=data.items||[],root=$('#musicSuggestions'),status=$('#musicSuggestionStatus');
 if(root)root.innerHTML=items.map(musicRow).join('')||'<p class="meta pad">'+esc(data.message||'Play music or follow an artist to establish your taste profile.')+'</p>';
 if(status)status.textContent=data.message||'Ranked using followed musicians and recent listening history.';
};
window.rushMusicPlaybackState=state=>{
 const status=$('#musicStatus');if(status&&page==='music')status.textContent=state.state==='playing'?'PLAYING · '+(state.title||'track'):state.state==='loading'?'LOADING · '+(state.title||'track'):state.message||state.state;
 if(state.state==='playing'||state.state==='paused'||state.state==='error'){if(window.RushNative)RushNative.loadCurrentPlayback()}
};
window.rushMusicLyricsLoading=()=>{const s=$('#lyricsStatus');if(s)s.textContent='Loading lyrics…'};
window.rushMusicLyricsError=error=>{const s=$('#lyricsStatus');if(s)s.textContent=error.message||'Lyrics unavailable.';const root=$('#lyricsPanel');if(root)root.innerHTML=''};
window.rushMusicLyrics=data=>{
 const status=$('#lyricsStatus'),root=$('#lyricsPanel');if(!root)return;
 const lines=(data.synced||'').split(/\r?\n/).map(line=>{
  const matches=[...line.matchAll(/\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g)];
  const text=line.slice(matches.length?matches[matches.length-1].index+matches[matches.length-1][0].length:0).trim();
  return matches.map(m=>({time:(+m[1]*60)+(+m[2])+(+(m[3]||0)/1000),text})).filter(x=>x.text);
 }).flat().sort((a,b)=>a.time-b.time);
 if(lines.length){root.innerHTML=lines.map((x,i)=>'<button class="lyric-line" data-lyric-index="'+i+'">'+esc(x.text)+'</button>').join('');window._widgetlyLyrics=lines;status.textContent='Synced lyrics · '+(data.title||'')}
 else if(data.plain){root.textContent=data.plain;window._widgetlyLyrics=[];status.textContent='Lyrics · not timed'}
 else{root.textContent='';status.textContent='No lyrics available.'}
};
window.rushNewsLoading=state=>{const s=$('#newsStatus');if(s)s.textContent='Loading: '+state.query+'…'};
window.rushNewsError=error=>{const s=$('#newsStatus')||$('#unifiedStatus');if(s)s.textContent=error.message||'Could not load news.'};
window.rushNewsResults=items=>{
 unifiedData.news=items;renderSearchResults();
 const root=$('#newsResults');if(root)root.innerHTML=items.map(newsCard).join('')||'<p class="meta pad">No articles found.</p>';
 const status=$('#newsStatus');if(status)status.textContent=items.length+' articles · ranked by your topics and publisher follows';
};
window.rushMusicLyricsLoading=window.rushMusicLyricsLoading;
setInterval(()=>{
 if(page!=='music'||!window._widgetlyLyrics?.length||!window.RushNative||!mediaState.isMusic)return;
 const pos=RushNative.musicPosition()/1000;let active=-1;
 window._widgetlyLyrics.forEach((x,i)=>{if(x.time<=pos)active=i});
 document.querySelectorAll('.lyric-line').forEach((line,i)=>{
  const on=i===active;line.classList.toggle('active',on);
  if(on&&line.dataset.visible!=='1'){line.dataset.visible='1';line.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})}
  else if(!on)line.dataset.visible='0';
 });
},350);
window.addEventListener('hashchange',go);
window.addEventListener('resize',()=>{navPosition();indicator();if(window.RushNative&&page==='videos')RushNative.updateVideoPosition()});
loadPrefs();
go();
</script>
</body></html>
